{% extends "base.html" %}
{% block title %}Método no permitido (405){% endblock %}

{% block contenido %}
<div class="container has-text-centered mt-6">
    <h1 class="title is-1 has-text-info">Error 405</h1>
    <h2 class="subtitle is-3">Método No Permitido (Method Not Allowed)</h2>
    <p class="mb-5">El método HTTP utilizado para acceder a esta ruta no está permitido.</p>
    <a href="{{ url_for('juegos') }}" class="button is-link">Volver al inicio</a>
</div>
{% endblock %}
