{% extends "maestra.html" %}

{% block titulo %} Editar juego {% endblock %}

{% block contenido %}
<section class="section">
    <div class="columns">
        <div class="column">
            <h3 class="is-size-3">Editar juego</h3>
            <form action="{{url_for('actualizar_juego')}}" method="post">
                <input type="hidden" name="id" value="{{ juego.id }}">
                <label for="nombre">Nombre:</label>
                <input value="{{ juego.nombre }}" required type="text" class="input mb-2" name="nombre" id="nombre">
                <label for="descripcion">Descripción</label>
                <input value="{{ juego.descripcion }}" required type="text" class="input mb-2" name="descripcion" id="descripcion">
                <label for="precio">Precio</label>
                <input value="{{ juego.precio }}" required type="number" step="0.01" class="input mb-2" name="precio" id="precio">
                <button type="submit" class="button is-success mt-2">Actualizar</button>
                <a href="{{url_for('juegos')}}" class="button is-light mt-2">Volver</a>
            </form>
        </div>
    </div>
</section>
{% endblock %}
